<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список товаров</title>
</head>
<body>
    <h1>Каталог товаров myShop</h1>
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'myShop:product_detail' product.pk %}">{{ product.title }}</a> 
                — {{ product.price }} руб.
            </li>
        {% empty %}
            <li>Товаров пока нет. Зайдите в админ и добавьте товар!</li>
        {% endfor %}
    </ul>
    <p><a href="/admin/">Перейти в панель администратора</a></p>
</body>
</html>
